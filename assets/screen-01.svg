vetica, Arial, sans-serif" font-size="12.5" fill="#6B7A72" font-weight="400" text-anchor="start" letter-spacing="0">Head to head, higher score goes through</text><rect x="80" y="560" width="636" height="62" rx="8" fill="#FFFFFF" opacity="1" stroke="#E4E0D4" stroke-width="1"/><circle cx="110" cy="591" r="9" fill="none" opacity="1"/><circle cx="110" cy="591" r="9" fill="none" stroke="#C9CFCB" stroke-width="2"/><text x="136" y="587" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0E1613" font-weight="600" text-anchor="start" letter-spacing="0">Group + Knockout</text><text x="136" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B7A72" font-weight="400" text-anchor="start" letter-spacing="0">Groups, then a bracket</text><rect x="80" y="648" width="168" height="46" rx="7" fill="#8C2A44" opacity="1"/><text x="164" y="677" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F5F2E9" font-weight="600" text-anchor="middle" letter-spacing="0">Create competition</text><rect x="780" y="250" width="572" height="220" rx="10" fill="#FFFFFF" opacity="1" stroke="#E4E0D4" stroke-width="1"/><text x="812" y="292" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" fill="#6B7A72" font-weight="600" text-anchor="start" letter-spacing="1.4">WHAT HAPPENS NEXT</text><circle cx="820" cy="322" r="3.5" fill="#F2C14E" opacity="1"/><text x="838" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0E1613" font-weight="400" text-anchor="start" letter-spacing="0">A join code is generated for you</text><circle cx="820" cy="354" r="3.5" fill="#F2C14E" opacity="1"/><text x="838" y="358" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0E1613" font-weight="400" text-anchor="start" letter-spacing="0">You are added as the admin</text><circle cx="820" cy="386" r="3.5" fill="#F2C14E" opacity="1"/